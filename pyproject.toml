[project]
name = "aueb-agents-ca"
version = "0.1.0"
description = "Customer Analytics: a simple review-summarizer agent (AUEB MSc Data Science)"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.42.0",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "trafilatura>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aueb_agents_ca"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "ipykernel>=7.4.0",
    "isort>=9.0.2",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
]
